version: '3.8'

services:
  # ── CouchDB ────────────────────────────────────────────────
  couchdb:
    container_name: zitate-couchdb
    build:
      context: ./couchdb
      dockerfile: Dockerfile
    image: zitate-couchdb:local
    restart: unless-stopped
    environment:
      - COUCHDB_USER=${COUCHDB_USER:-admin}
      - COUCHDB_PASSWORD=${COUCHDB_PASSWORD:-changeme}
    ports:
      - "5984:5984"
    volumes:
      - couchdb-data:/opt/couchdb/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5984/_up || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    labels:
      - "com.zitate.app=couchdb"

  # ── Web app (pre-built images) ─────────────────────────────
  zitate-web-1:
    container_name: zitate-web
    image: ghcr.io/thst71/zitate-web:1
    ports:
      - "8080:8080"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    depends_on:
      couchdb:
        condition: service_healthy

  zitate-web-2:
    container_name: zitate-web-2
    image: ghcr.io/thst71/zitate-web:2
    ports:
      - "8080:8080"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    depends_on:
      couchdb:
        condition: service_healthy

  zitate-web-build:
    container_name: zitate-web-build
    image: ghcr.io/thst71/zitate-web:local
    build:
      context: Zitate.web/.
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - APP_VERSION=SNAPSHOT_LOCAL
    depends_on:
      couchdb:
        condition: service_healthy
    labels:
      - "com.zitate.app=web"
      - "com.zitate.version=SNAPSHOT"

volumes:
  couchdb-data:

