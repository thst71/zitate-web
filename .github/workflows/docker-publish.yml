# Quality gate and Docker build (without push) for pull requests. Images are published only by
# release.yml, from a verified signed tag v<semver>.
name: Pull Request Checks

on:
  pull_request:
    branches: [ "main" ]
    paths:
      - 'Zitate.web/**'
      - '.github/workflows/docker-publish.yml'
      - '.agents/**'
      - 'specification/**'
      - '*.adoc'
      - 'SPEC.md'

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: Zitate.web/package-lock.json

      - name: Install dependencies
        working-directory: ./Zitate.web
        run: npm ci

      - name: Run the quality gate
        working-directory: ./Zitate.web
        run: npm run check

      - name: Run security audit
        working-directory: ./Zitate.web
        run: npm audit --audit-level moderate

  build:
    needs: [quality]

    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ./Zitate.web
          file: ./Zitate.web/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            APP_VERSION=pr-${{ github.event.pull_request.number }}
          push: false
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,scope=${{ matrix.platform }},mode=max
