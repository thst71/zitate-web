; CouchDB local configuration for Zitate
; This file is mounted into the CouchDB container at /opt/couchdb/etc/local.d/

[couchdb]
; Single-node setup (no clustering)
single_node = true

[couch_peruser]
; Automatically create a database for each new user
enable = true
; Database names follow the pattern: userdb-<hex-encoded-username>
delete_dbs = false

[chttpd]
; Bind to all interfaces inside the container
bind_address = 0.0.0.0
port = 5984
; Require authentication for all requests (except _session and _up)
require_valid_user = true

[httpd]
enable_cors = true

[cors]
; Origins allowed to make requests to CouchDB.
; In production behind nginx reverse proxy, requests arrive from the same
; origin so CORS headers are technically unnecessary. We enable them for
; direct-access development scenarios (e.g. Vite dev server on localhost:5173).
origins = *
credentials = true
methods = GET, PUT, POST, HEAD, DELETE, OPTIONS
headers = accept, authorization, content-type, origin, referer, x-csrf-token

[log]
level = info

